[project]
name = "ltt-churn-intelligence-api"
version = "0.1.0"
description = "Predictive churn decision-support API for a synthetic LTT-like telecom dataset."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pandas==2.3.1",
  "numpy==2.2.6",
  "scikit-learn==1.7.1",
  "xgboost==3.0.4",
  "shap==0.48.0",
  "joblib==1.5.1",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "httpx==0.28.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
