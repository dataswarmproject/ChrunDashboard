services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ltt_churn
      POSTGRES_USER: ltt_churn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltt_churn -d ltt_churn"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: docker
      POSTGRES_HOST: db
      POSTGRES_DB: ltt_churn
      POSTGRES_USER: ltt_churn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SYNTHETIC_RECORDS: 12000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - prediction_data:/app/data
      - model_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  prediction_data:
  model_artifacts:
